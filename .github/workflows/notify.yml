name: Notify Task Tracker

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  telegram:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true || github.event.action != 'closed'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Wait for other workflows
        uses: lewagon/wait-on-check-action@e106e5c43e8ca1edea6383a39a01c5ca495fd812
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          running-workflow-name: 'telegram'
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          wait-interval: 10
          allowed-conclusions: success,failure,cancelled,skipped

      - name: Get workflow results
        id: results
        uses: actions/github-script@v7
        with:
          script: |
            const { data: checkRuns } = await github.rest.checks.listForRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha
            });

            const workflows = checkRuns.check_runs.filter(run =>
              ['Test', 'Lint', 'Build'].some(name => run.name.includes(name)) &&
              !run.name.includes('telegram') &&
              !run.name.includes('Notify')
            );

            const allSuccess = workflows.every(w => w.conclusion === 'success');
            const anyFailure = workflows.some(w => w.conclusion === 'failure');

            let conclusion = 'success';
            let emoji = '✅';

            if (anyFailure) {
              conclusion = 'failure';
              emoji = '❌';
            } else if (!allSuccess) {
              conclusion = 'pending';
              emoji = '🔄';
            }

            core.setOutput('conclusion', conclusion);
            core.setOutput('emoji', emoji);
            core.setOutput('count', workflows.length);

      - name: Build message per event
        id: msg
        run: |
          ACTION="${{ github.event.action }}"
          MERGED="${{ github.event.pull_request.merged }}"
          PR_NUM="${{ github.event.pull_request.number }}"
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_URL="${{ github.event.pull_request.html_url }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"
          HEAD="${{ github.event.pull_request.head.ref }}"
          BASE="${{ github.event.pull_request.base.ref }}"
          COMMITS="${{ github.event.pull_request.commits }}"
          REPO="${{ github.repository }}"
          CHECKS="${{ steps.results.outputs.count }}"
          STATUS="${{ steps.results.outputs.conclusion }}"
          CHECK_EMOJI="${{ steps.results.outputs.emoji }}"

          if [ "$MERGED" == "true" ]; then
            MESSAGE="🎉 <b>PR Merged in Task Tracker!</b>

            🔀 <b>PR #${PR_NUM}</b> — ${PR_TITLE}

            👤 Author    : @${AUTHOR}
            🌿 Branch    : ${HEAD} → ${BASE}
            📦 Repo      : ${REPO}
            🔢 Commits   : ${COMMITS} commit(s)
            ${CHECK_EMOJI} CI Status  : ${STATUS} (${CHECKS} checks)

            ✨ Changes have landed on <code>${BASE}</code>!
            🔗 <a href=\"${PR_URL}\">View Pull Request</a>"

          elif [ "$ACTION" == "opened" ]; then
            MESSAGE="🚀 <b>New PR Opened in Task Tracker!</b>

            📝 <b>PR #${PR_NUM}</b> — ${PR_TITLE}

            👤 Author    : @${AUTHOR}
            🌿 Branch    : ${HEAD} → ${BASE}
            📦 Repo      : ${REPO}
            🔢 Commits   : ${COMMITS} commit(s)

            👀 Review needed — let's go!
            🔗 <a href=\"${PR_URL}\">View Pull Request</a>"

          elif [ "$ACTION" == "synchronize" ]; then
            MESSAGE="🔄 <b>PR Updated in Task Tracker!</b>

            📝 <b>PR #${PR_NUM}</b> — ${PR_TITLE}

            👤 Author    : @${AUTHOR}
            🌿 Branch    : ${HEAD} → ${BASE}
            📦 Repo      : ${REPO}
            🔢 Commits   : ${COMMITS} commit(s)
            ${CHECK_EMOJI} CI Status  : ${STATUS} (${CHECKS} checks)

            ⚡ New push detected, checks are running...
            🔗 <a href=\"${PR_URL}\">View Pull Request</a>"

          elif [ "$ACTION" == "reopened" ]; then
            MESSAGE="♻️ <b>PR Reopened in Task Tracker!</b>

            📝 <b>PR #${PR_NUM}</b> — ${PR_TITLE}

            👤 Author    : @${AUTHOR}
            🌿 Branch    : ${HEAD} → ${BASE}
            📦 Repo      : ${REPO}
            🔢 Commits   : ${COMMITS} commit(s)

            🙌 Back in action!
            🔗 <a href=\"${PR_URL}\">View Pull Request</a>"

          else
            MESSAGE="🚫 <b>PR Closed in Task Tracker!</b>

            📝 <b>PR #${PR_NUM}</b> — ${PR_TITLE}

            👤 Author    : @${AUTHOR}
            🌿 Branch    : ${HEAD} → ${BASE}
            📦 Repo      : ${REPO}

            ❌ PR ditutup tanpa di-merge.
            🔗 <a href=\"${PR_URL}\">View Pull Request</a>"
          fi

          echo "text<<EOF" >> $GITHUB_OUTPUT
          echo "$MESSAGE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Send Telegram Notification
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          message: ${{ steps.msg.outputs.text }}
